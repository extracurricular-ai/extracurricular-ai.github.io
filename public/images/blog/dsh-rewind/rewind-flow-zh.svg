<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="title desc">
<title id="title">回退，然后撤销这次回退</title><desc id="desc">执行回退时，原对话记录仍然保留。 从选定的恢复点继续。 共用一个工作区目录. 利用救援状态撤销回退，返回原对话。</desc>
<rect width="760" height="680" rx="24" fill="#f6f9ff"/>
<g font-family="system-ui, sans-serif" fill="#163666">
<text x="40" y="56" font-size="30" font-weight="700">回退，然后撤销这次回退</text>
<rect x="40" y="90" width="680" height="106" rx="16" fill="white" stroke="#c5d6f9"/>
<text x="64" y="132" font-size="26" font-weight="700">1  原对话</text><text x="64" y="170" font-size="22">执行回退时，原对话记录仍然保留。</text>
<path d="M380 207v25m-8-8 8 8 8-8" fill="none" stroke="#4176e6" stroke-width="3"/>
<rect x="40" y="244" width="680" height="106" rx="16" fill="white" stroke="#4176e6" stroke-width="2"/>
<text x="64" y="286" font-size="26" font-weight="700">2  子会话</text><text x="64" y="324" font-size="22">从选定的恢复点继续。</text>
<rect x="40" y="374" width="680" height="106" rx="16" fill="#edf3fe"/>
<text x="64" y="416" font-size="26" font-weight="700">共用一个工作区目录</text><text x="64" y="454" font-size="22">回退在这里恢复已捕获的文件。</text>
<path d="M380 492v24m-8-8 8 8 8-8" fill="none" stroke="#4176e6" stroke-width="3"/>
<rect x="40" y="528" width="680" height="112" rx="16" fill="#4176e6"/>
<text x="64" y="570" font-size="26" font-weight="700" fill="white">3  在子会话执行 /redo</text><text x="64" y="610" font-size="22" fill="white">利用救援状态撤销回退，返回原对话。</text>
</g></svg>